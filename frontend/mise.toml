[tools]
# Keep these aligned with package.json.
bun = "1.4.2"
vp = "0.3.1"

[env]
# Defaults for local development. Override in the shell to point elsewhere.
# Local Frappe Manager site; the Vite dev server proxies Frappe paths to it.
FRAPPE_URL = "http://erpdev.localhost"
# Frappe Manager bench and site; bench commands run inside its container.
FM_BENCH = "erpdev.localhost"
FRAPPE_SITE = "erpdev.localhost"

[tasks.setup-frappe-bench]
description = "Set up the Frappe development bench"
run = '''
fm create "$FM_BENCH" \
  --environment dev \
  --apps frappe:version-16 \
  --apps erpnext:version-16 \
  --python 3.14
'''


[tasks.init_setu]
description = "Fetch the setu app into the Frappe bench"
run = 'fm shell "$FM_BENCH" -c "bench get-app https://github.com/unoplat/setu.git"'

[tasks.backend]
description = "Start the Frappe Manager site separately (requires Docker/OrbStack)"
run = 'fm start "$FM_BENCH"'

[tasks.tunnel]
description = "Expose the local Frappe site through a temporary public HTTPS URL (requires cloudflared)"
run = 'cloudflared tunnel --url http://127.0.0.1:80 --http-host-header "$FRAPPE_SITE"'

[tasks.dev]
description = "Build and deploy the frontend bundle and setu app; start Frappe separately with `mise run backend` (run `mise run migrate` after for custom field changes)"
depends = ["deploy-local"]

[tasks.build]
description = "Type-check and build the production bundle"
run = "vp run build"

[tasks.lint]
description = "Lint the project"
run = "vp run lint"

[tasks.format]
description = "Format TypeScript and TSX files"
run = "vp run format"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "vp run typecheck"

[tasks.react-audit]
description = "Do React audit using react doctor"
run = "pnpm dlx react-doctor@latest --verbose"

[tasks.preview]
description = "Preview the production build"
run = "vp run preview"

[tasks.add]
description = "Add one or more project dependencies with Vite+"
raw_args = true
run = "vp add"

[tasks.migrate]
description = "Run bench migrate on the Frappe Manager site (syncs setu custom fields and property setters)"
run = 'fm shell "$FM_BENCH" -c "bench --site $FRAPPE_SITE migrate"'

[tasks.deploy-local]
description = "Build, then copy the bundle and the setu Python app into the local bench clone (run `mise run migrate` after for DocType changes)"
depends = ["build"]
run = """
set -e
# Default Frappe Manager location; override BENCH_APP for a custom installation.
BENCH_APP="${BENCH_APP:-$HOME/frappe/sites/$FM_BENCH/workspace/frappe-bench/apps/setu}"
if [ ! -f "$BENCH_APP/pyproject.toml" ] || [ ! -d "$BENCH_APP/setu" ]; then
  echo "setu app not found at $BENCH_APP. Install it first, or set BENCH_APP to its actual path." >&2
  exit 1
fi
# Backend: API, DocTypes, hooks and setup. The bundle is copied separately below.
rsync -a --exclude __pycache__ --exclude public ../setu/ "$BENCH_APP/setu/"
rsync -a --delete ../setu/public/envision/ "$BENCH_APP/setu/public/envision/"
cp ../setu/www/envision.html "$BENCH_APP/setu/www/envision.html"
echo "deployed to $BENCH_APP"
"""
